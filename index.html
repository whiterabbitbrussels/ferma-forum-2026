  <style>
    :root {
      --bg: #0f0e0d;
      --panel: #171513;
      --panel-2: #211e1b;
      --card: #1f1c19;
      --line: #332e29;
      --text: #f4efe9;
      --muted: #9a918a;
      --orange: #ff6a13;
      --orange-soft: #ff8a44;
      --c-paid: #22c55e;
      --c-pending: #f59e0b;
      --c-not-started: #ef4444;
      --c-over: #ec4899;
      --c-tracked: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      min-height: 100%;
    }

    a {
      color: var(--orange-soft);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 268px;
      flex: none;
      background: var(--panel);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
    }

    .side-head {
      padding: 22px 20px 18px;
      border-bottom: 1px solid var(--line);
      flex: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 0 12px var(--orange);
    }

    .brand h1 {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
    }

    .side-head .sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }

    nav {
      padding: 14px 12px;
      overflow-y: auto;
      flex: 1;
    }

    .nav-label {
      font-size: 10px;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 14px 10px 7px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 10px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      user-select: none;
      transition: 0.13s;
      border: 1px solid transparent;
    }

    .nav-item:hover {
      background: var(--panel-2);
    }

    .nav-item.on {
      background: var(--panel-2);
      border-color: var(--line);
    }

    .nav-item.on .nav-name {
      font-weight: 650;
    }

    .nav-ico {
      width: 20px;
      text-align: center;
      flex: none;
      font-size: 13px;
    }

    .nav-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-count {
      font-size: 11px;
      color: var(--muted);
      background: var(--bg);
      padding: 2px 8px;
      border-radius: 20px;
      flex: none;
    }

    .legend {
      padding: 13px 18px 15px;
      border-top: 1px solid var(--line);
      flex: none;
    }

    .legend-title {
      font-size: 10px;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 9px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 11.5px;
      margin: 6px 0;
    }

    .legend-sw {
      width: 12px;
      height: 12px;
      border-radius: 4px;
      flex: none;
    }

    /* ===== MAIN ===== */
    main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .topbar {
      padding: 20px 30px 16px;
      border-bottom: 1px solid var(--line);
      flex: none;
      background: linear-gradient(180deg, #161412, #0f0e0d);
    }

    .crumb {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .view-title {
      font-size: 21px;
      font-weight: 700;
      margin: 5px 0 3px;
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .view-bar {
      width: 30px;
      height: 5px;
      border-radius: 3px;
    }

    .view-desc {
      font-size: 12.5px;
      color: var(--muted);
    }

    #search {
      margin-top: 13px;
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 9px 13px;
      border-radius: 9px;
      font-size: 13.5px;
    }

    #search:focus {
      outline: none;
      border-color: var(--orange);
    }

    .scroll {
      overflow-y: auto;
      padding: 22px 30px 70px;
      flex: 1;
    }

    /* ===== STATS ===== */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .stat-box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }

    .stat-desc {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    .progress-bar {
      background: var(--panel);
      height: 6px;
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--orange) 0%, var(--orange-soft) 100%);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    /* ===== COLLAPSIBLE SECTIONS ===== */
    details.section {
      margin: 30px 0 20px;
    }

    details.section > summary {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      list-style: none;
      user-select: none;
      margin-bottom: 8px;
    }

    details.section > summary::-webkit-details-marker {
      display: none;
    }

    details.section .chev {
      display: inline-block;
      color: var(--muted);
      font-size: 14px;
      transition: transform 0.15s;
    }

    details.section[open] .chev {
      transform: rotate(90deg);
    }

    details.section .section-desc {
      margin: 0 0 16px 28px;
      font-size: 12px;
      color: var(--muted);
    }

    /* ===== TABLE ===== */
    .table-wrap {
      overflow-x: auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead {
      background: var(--panel-2);
      border-bottom: 1px solid var(--line);
    }

    th {
      padding: 14px 16px;
      text-align: left;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 10px;
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid var(--line);
      transition: 0.13s;
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    td {
      padding: 14px 16px;
      vertical-align: middle;
    }

    .task-name {
      font-weight: 500;
      color: var(--text);
      max-width: 280px;
    }

    .hours-cell {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hours-numbers {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 12px;
    }

    .hours-budget {
      color: var(--muted);
    }

    .hours-invoiced {
      color: var(--orange-soft);
      font-weight: 600;
    }

    .hours-remaining {
      color: var(--muted);
      font-size: 11px;
    }

    .hours-remaining.over {
      color: var(--c-over);
      font-weight: 600;
    }

    .hours-tracked {
      color: var(--c-tracked);
      font-size: 11px;
    }

    .hours-progress {
      width: 120px;
      height: 24px;
      background: var(--panel);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--line);
      display: flex;
    }

    .hours-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--orange) 0%, var(--orange-soft) 100%);
      transition: width 0.3s ease;
    }

    /* Hours logged in the calendar but not yet invoiced */
    .hours-progress-tracked {
      height: 100%;
      background: repeating-linear-gradient(
        45deg,
        var(--c-tracked) 0px,
        var(--c-tracked) 4px,
        rgba(0, 0, 0, 0.25) 4px,
        rgba(0, 0, 0, 0.25) 8px
      );
      transition: width 0.3s ease;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: 0.13s;
      border: 1px solid;
      white-space: nowrap;
    }

    .status-badge.paid {
      background: rgba(34, 197, 94, 0.1);
      color: var(--c-paid);
      border-color: #1d3d27;
    }

    .status-badge.paid:hover {
      background: rgba(34, 197, 94, 0.2);
    }

    .status-badge.pending {
      background: rgba(245, 158, 11, 0.1);
      color: var(--c-pending);
      border-color: #3d2d1a;
    }

    .status-badge.pending:hover {
      background: rgba(245, 158, 11, 0.2);
    }

    .status-badge.not-started {
      background: rgba(239, 68, 68, 0.1);
      color: var(--c-not-started);
      border-color: #3d1d1d;
    }

    .status-badge.not-started:hover {
      background: rgba(239, 68, 68, 0.2);
    }

    .status-badge.over {
      background: rgba(236, 72, 153, 0.1);
      color: var(--c-over);
      border-color: #3d1d2d;
    }

    .status-badge.over:hover {
      background: rgba(236, 72, 153, 0.2);
    }

    .amount-invoiced {
      font-weight: 600;
      color: var(--text);
    }

    .amount-remaining {
      color: var(--text);
      font-weight: 500;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--orange);
      color: #1a0d04;
      padding: 11px 22px;
      border-radius: 9px;
      font-weight: 600;
      font-size: 13px;
      opacity: 0;
      transition: 0.25s;
      pointer-events: none;
      z-index: 9;
    }

    .toast.show {
      opacity: 1;
    }

    @media (max-width: 780px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: auto;
        position: static;
        border-right: none;
        border-bottom: 1px solid var(--line);
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      main {
        height: auto;
      }

      .scroll {
        overflow: visible;
      }

      th, td {
        padding: 10px 8px;
        font-size: 12px;
      }
    }
  </style>

        status: "pending",
        reference: "",
        ferma: "Covered by the 25h of PM remaining — no extra cost",
        section: "new-realloc"
      },
      {
        // Catch-all bucket: calendar work with no dedicated deliverable
        // (stage design, badges, misc. materials). No budget of its own —
        // every hour logged here is billed at €85/h.
        id: 25,
        name: "Materials (misc. onsite & comms items)",
        budgetHours: 0,
        invoicedHours: 0,
        remainingHours: 0,
        hourlyRate: 85.00,
        amountInvoiced: 0.00,
        amountRemaining: 0.00,
        status: "pending",
        reference: "",
        ferma: "Catch-all for work without a specific deliverable — billed as logged",
        section: "new-realloc"
      }
    ];

    let tasks = [...TASKS];
    let view = "all";
    let term = "";
    // Which table sections are expanded. Kept here (not in the DOM) because
    // render() rebuilds the whole content, which would otherwise snap
    // First Estimation shut every time a note or dropdown changes.
    const openSections = { "new-realloc": true, "approved": false };

    // ── Invoice cut-off ("punto zero") ─────────────────────────────────
    // Calendar hours logged ON OR BEFORE this date are settled: they count as
    // INVOICED & PAID on their task (orange segment). Anything logged after it
    // is "tracked, not invoiced" (blue) and the count restarts from zero.
    // Move the date forward at the next invoice.
    const INVOICE_CUTOFF = '2026-09-08';   // ISO yyyy-mm-dd, inclusive

    // Calendar title → task id, baked in so every viewer (client included)
    // sees the same allocation. Keys are normalizeName(title). The dropdown
    // in the timesheet still overrides per browser; use "Copy assignments"
    // to hand new ones over so they can be baked in here.
    const ENTRY_TASK_MAP = {
      // Project Management (Coordination) — meetings, catch-ups, feedback rounds
      'forum 26 martamaria': 24,
      'materials overview': 24,
      'forum presentation': 24,
      'meeting': 24,
      'feedbacks applied': 24,
      'catch up': 24,
      'feedback emails': 24,
      'materials martamaria': 24,
      // General Map - 2nd & 3rd Floors
      'map design isometric': 20,
      'maps redesign': 20,
      'forum map 2 floors': 20,
      'maps 2nd 3rd general': 20,
      'maps finalisation': 20,
      'mappa general view': 20,
      'maps presentation': 20,
      'forum maps finalisation': 20,
      'maps fine tuning': 20,
      'white rabbit lena maps': 20,
      // AI HARBOUR Design
      'harbour': 22,
      'catch up delivery harbour': 22,
      'harbour design': 22,
      'forum harbour': 22,
      'harbour finalisation': 22,
      'insegna ai harbour': 22,
      'harbour print files': 22,
      'ai harbour print files': 22,
      'ai harbour printing file request': 22,
      // Event Programme
      'programme design': 21,
      // Approx. 20 Directional Banners
      'banner entrance': 17,
      'banners entrance': 17,
      'banners design': 17,
      // Registration Desk
      'registration desk': 19,
      // Materials (catch-all) — also the automatic fallback, see MATERIALS_TASK_ID
      'stage design': 25,
      'badge european risk forum logo modified': 25
    };

    // Keyword rules for free-text titles the exact matcher misses
    // ("Maps modifications", "Harbour switch sides", "Ale catch up"…).
    // First matching rule wins, so order = priority. Exact keys above and the
    // dropdown always take precedence over these.
    const KEYWORD_RULES = [
      [/harbour/, 22],                                   // AI HARBOUR Design
      [/\bmaps?\b|mappa/, 20],                           // General Map - 2nd & 3rd Floors
      [/programme/, 21],                                 // Event Programme
      [/banner/, 17],                                    // Approx. 20 Directional Banners
      [/registration|reception/, 19],                    // Registration Desk
      [/catch up|meeting|feedback|presentation|martamaria|\bemails?\b/, 24]  // PM (Coordination)
    ];

    // Any calendar entry that matches no deliverable lands here instead of
    // being left uncounted. "— not counted —" in the dropdown still wins.
    const MATERIALS_TASK_ID = 25;

    const $ = s => document.querySelector(s);
    const statusOf = k => STATUSES.find(s => s.key === k);

    // ── FERMA notes persistence ────────────────────────────────────────
    // Notes typed in the FERMA column are kept per task id in localStorage,
    // so they survive a page reload. Only edited tasks are stored; anything
    // untouched keeps the default text shipped in TASKS.
    const NOTES_KEY = 'FERMA_TASK_NOTES';

    function loadNotes() {
      try {
        const raw = localStorage.getItem(NOTES_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        tasks.forEach(t => {
          if (Object.prototype.hasOwnProperty.call(saved, t.id)) t.ferma = saved[t.id];
        });
      } catch (e) {
        console.warn('Could not read saved FERMA notes:', e);
      }
    }

    function saveNote(taskId, value) {
      try {
        const raw = localStorage.getItem(NOTES_KEY);
        const saved = raw ? JSON.parse(raw) : {};
        saved[taskId] = value;
        localStorage.setItem(NOTES_KEY, JSON.stringify(saved));
      } catch (e) {
        console.warn('Could not save FERMA note:', e);
      }
    }

    loadNotes();

    // ── Calendar → task matching ───────────────────────────────────────
    // Calendar events arrive as free text ("FRM - Event Programme v2"), so we
    // normalise both sides before comparing: lowercase, accents stripped,
    // "&" spelled out, everything else collapsed to single spaces.
    // Hours are summed from calendar durations, so keep one decimal to avoid
    // 3.9999999h showing up in the table.
    const round1 = n => Math.round(n * 10) / 10;

    // Hours logged beyond a line's budget are billed to the client at the
    // line's hourly rate (agreed 2026-09-14). `consumed` = invoiced + calendar.
    const overHoursOf = (t, consumed) => Math.max(0, round1(consumed - t.budgetHours));
    const overAmountOf = (t, consumed) => Math.round(overHoursOf(t, consumed) * t.hourlyRate * 100) / 100;

    // Calendar dates arrive as ISO "yyyy-MM-dd"; show them European style.
    const fmtEU = iso => {
      const [y, m, d] = String(iso || '').split('-');
      return y && m && d ? d + '/' + m + '/' + y : (iso || '—');
    };

    // Calendar hours are only ever charged against New Production. The First
    // Estimation lines are closed work, billed on the approved figures, so
    // time logged today must not eat into them.
    const trackableTasks = () => tasks.filter(t => t.section === 'new-realloc');

    function normalizeName(s) {
      return (s || '')
        .toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/&/g, ' and ')
        .replace(/[^a-z0-9]+/g, ' ')
        .trim();
    }

    // ── Manual entry → task overrides ──────────────────────────────────
    // Calendar titles are written by hand and rarely match a deliverable
    // exactly (">Forum Harbour", "Catch-up delivery FERMA HARBOUR"). Rather
    // than guess, unrecognised titles can be assigned by hand. The choice is
    // keyed on the normalised title, so assigning it once also covers every
    // future event with that same title.
    const ENTRY_MAP_KEY = 'FERMA_ENTRY_TASK_MAP';

    function loadLocalEntryMap() {
      try {
        const raw = localStorage.getItem(ENTRY_MAP_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        console.warn('Could not read entry map:', e);
        return {};
      }
    }

    // Baked-in map first, this browser's choices on top.
    function loadEntryMap() {
      return Object.assign({}, ENTRY_TASK_MAP, loadLocalEntryMap());
    }

    function setEntryOverride(normTitle, taskId) {
      try {
        const map = loadLocalEntryMap();
        // null (not delete): "— not counted —" must also be able to undo a
        // baked-in assignment, and computeTracked treats null as unmatched.
        map[normTitle] = taskId == null ? null : taskId;
        localStorage.setItem(ENTRY_MAP_KEY, JSON.stringify(map));
      } catch (e) {
        console.warn('Could not save entry map:', e);
      }
    }

    // Maps every calendar entry onto a task and sums the hours.
    // Returns { byTask: {taskId: hours}, matchOf: {entryIndex: taskId}, unmatched: [...] }.
    // Anything that cannot be matched is reported rather than dropped, so the
    // budget figures are never silently wrong.
    function computeTracked() {
      const byTask = {};        // taskId -> hours logged AFTER the cut-off (tracked, not invoiced)
      const frozenByTask = {};  // taskId -> hours logged up to the cut-off (settled: invoiced & paid)
      const datesByTask = {};   // taskId -> [ISO dates of matched calendar entries]
      const matchOf = {};
      const unmatched = [];
      const overrides = loadEntryMap();

      // Only New Production lines can absorb calendar hours — see trackableTasks().
      const trackable = trackableTasks();
      const isTrackable = id => trackable.some(t => t.id === id);

      const candidates = trackable
        .map(t => ({ id: t.id, norm: normalizeName(t.name) }))
        .filter(c => c.norm);
      const longestFirst = candidates.slice().sort((a, b) => b.norm.length - a.norm.length);
      const shortestFirst = candidates.slice().sort((a, b) => a.norm.length - b.norm.length);

      timeEntries.forEach((entry, i) => {
        const hours = Number(entry.hours) || 0;
        const normTitle = normalizeName(entry.taskName);
        let matchId = null;

        if (Object.prototype.hasOwnProperty.call(overrides, normTitle)) {
          // A hand-made assignment always wins over the automatic guess.
          const id = overrides[normTitle];
          if (isTrackable(id)) matchId = id;
        } else if (entry.taskId != null && isTrackable(entry.taskId)) {
          matchId = entry.taskId;
        } else {
          const norm = normTitle;
          if (norm) {
            const exact = candidates.find(c => c.norm === norm);
            if (exact) {
              matchId = exact.id;
            } else {
              // Event title carries the full task name plus extra words.
              // Longest task first, so "Project Management (Coordination)"
              // wins over the shorter "Project Management".
              const contained = longestFirst.find(c => norm.includes(c.norm));
              if (contained) {
                matchId = contained.id;
              } else if (norm.length >= 8) {
                // Event title is a shortened form of the task name. Take the
                // tightest fit; short titles are ignored as too ambiguous.
                const container = shortestFirst.find(c => c.norm.includes(norm));
                if (container) matchId = container.id;
              }
            }
          }
        }

        const explicitlyNotCounted = Object.prototype.hasOwnProperty.call(overrides, normTitle) && overrides[normTitle] == null;

        // Still nothing → keyword rules, then the Materials bucket.
        if (matchId == null && !explicitlyNotCounted) {
          const rule = KEYWORD_RULES.find(([re, id]) => re.test(normTitle) && isTrackable(id));
          if (rule) matchId = rule[1];
          else if (isTrackable(MATERIALS_TASK_ID)) matchId = MATERIALS_TASK_ID;
        }

        if (matchId == null) {
          unmatched.push(entry);
        } else {
          matchOf[i] = matchId;
          const bucket = entry.date && entry.date <= INVOICE_CUTOFF ? frozenByTask : byTask;
          bucket[matchId] = (bucket[matchId] || 0) + hours;
          if (entry.date) (datesByTask[matchId] = datesByTask[matchId] || []).push(entry.date);
        }
      });

      return { byTask, frozenByTask, datesByTask, matchOf, unmatched };
    }

    function toast(m) {
      const t = $("#toast");
      t.textContent = m;
      t.classList.add("show");
      clearTimeout(t._t);
      t._t = setTimeout(() => t.classList.remove("show"), 1900);
    }

    function renderNav() {
      let h = '<div class="nav-label">View</div>' +
        navItem("all", "▦", "All Tasks", tasks.length);

      h += '<div class="nav-label">By Status</div>';
      STATUSES.forEach(s => {
        const n = tasks.filter(t => t.status === s.key).length;
        if (n > 0) h += navItem(s.key, s.emoji, s.label, n);
      });

      const nav = $("#nav");
      nav.innerHTML = h;
      nav.querySelectorAll(".nav-item").forEach(it => it.onclick = () => {
        view = it.dataset.view;
        term = "";
        $("#search").value = "";
        render();
      });
    }

    function navItem(v, ico, name, count) {
      const on = view === v ? " on" : "";
      return '<div class="nav-item' + on + '" data-view="' + v + '">' +
        '<span class="nav-ico">' + ico + '</span>' +
        '<span class="nav-name">' + name + '</span>' +
        '<span class="nav-count">' + count + '</span></div>';
    }

    function renderLegend() {
      let h = '<div class="legend-title">Status Guide</div>';
      STATUSES.forEach(s => {
        h += '<div class="legend-row"><span class="legend-sw" style="background:' + s.color + '"></span>' +
          s.label + '</div>';
      });
      $("#legend").innerHTML = h;
    }

    function renderStats() {
      const { byTask: trackedByTask, frozenByTask, unmatched } = computeTracked();
      const trackedTotal = tasks.reduce((s, t) => s + (trackedByTask[t.id] || 0), 0);
      const frozenTotal = tasks.reduce((s, t) => s + (frozenByTask[t.id] || 0), 0);

      const approved = tasks.filter(t => t.section === "approved");
      const newRealloc = tasks.filter(t => t.section === "new-realloc");

      const approvedBudget = approved.reduce((s, t) => s + t.budgetHours, 0);
      const approvedInvoiced = approved.reduce((s, t) => s + t.invoicedHours, 0);
      const approvedRemaining = approved.reduce((s, t) => s + t.remainingHours, 0);

      const newReallocBudget = newRealloc.reduce((s, t) => s + t.budgetHours, 0);

      // Production work in New Production, excluding the PM Coordination line (billed €0)
      const newReallocPaid = newRealloc.filter(t => t.amountRemaining > 0).reduce((s, t) => s + t.budgetHours, 0);

      // The 25h of PM still open are earmarked for the New Production PM Coordination line,
      // so they are NOT available to fund production work. Only the rest can be reallocated:
      // Design 25h + PPT 2h + Leaflet 8h + Flyer 4h - Animation 5h over = 34h
      const pmEarmarkedHours = 25;
      const reallocatedHours = approvedRemaining - pmEarmarkedHours;
      const newBudgetHours = Math.max(0, newReallocPaid - reallocatedHours);
      const newBudgetAmount = newBudgetHours * 85;

      // Still to bill on the approved budget (the 59h left, net of the Animation overrun)
      const originalPending = approved.reduce((s, t) => s + t.amountRemaining, 0);

      const totalAmountInvoiced = tasks.reduce((s, t) => s + t.amountInvoiced, 0);

      // Hours logged beyond budget on New Production lines — billed at task rate
      const overAmount = newRealloc.reduce((s, t) => {
        const consumed = t.invoicedHours + (frozenByTask[t.id] || 0) + (trackedByTask[t.id] || 0);
        return s + overAmountOf(t, consumed);
      }, 0);

      return `
        <div class="stats">
          <div class="stat-box">
            <div class="stat-label">First Estimation</div>
            <div class="stat-value">${approvedBudget}h</div>
            <div class="stat-desc">Original scope (${approvedInvoiced}h invoiced)</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Available to Reallocate</div>
            <div class="stat-value">${reallocatedHours}h</div>
            <div class="stat-desc">Design 25h + PPT 2h + Leaflet 8h + Flyer 4h − Animation 5h over. PM 25h stay earmarked for coordination.</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">New Production</div>
            <div class="stat-value">${newReallocBudget}h</div>
            <div class="stat-desc">${reallocatedHours}h reallocated + ${pmEarmarkedHours}h PM earmarked + ${newBudgetHours}h new budget</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">New Budget</div>
            <div class="stat-value">€${Math.round(newBudgetAmount + overAmount).toLocaleString('it-IT')}</div>
            <div class="stat-desc">${newBudgetHours}h @ €85/h not covered by reallocation${overAmount > 0 ? ` <span style="color: var(--c-over);">+ €${Math.round(overAmount).toLocaleString('it-IT')} for hours logged beyond budget (billed at task rate)</span>` : ''}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Tracked, Not Invoiced</div>
            <div class="stat-value" style="color: var(--c-tracked);">${round1(trackedTotal)}h</div>
            <div class="stat-desc">Calendar hours logged after ${fmtEU(INVOICE_CUTOFF)}, not yet invoiced. <span style="color: var(--orange-soft);">${round1(frozenTotal)}h</span> logged up to ${fmtEU(INVOICE_CUTOFF)} are settled — invoiced &amp; paid — on their New Production lines. First Estimation is never touched.${unmatched.length ? ` <span style="color: var(--c-over);">${unmatched.length} entr${unmatched.length === 1 ? 'y' : 'ies'} unassigned — see timesheet.</span>` : ''}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Total Project Value</div>
            <div class="stat-value">€${Math.round(totalAmountInvoiced + originalPending + newBudgetAmount + overAmount).toLocaleString('it-IT')}</div>
            <div class="stat-desc">€${totalAmountInvoiced.toLocaleString('it-IT')} invoiced • €${Math.round(originalPending).toLocaleString('it-IT')} pending (First Estimation) • €${Math.round(newBudgetAmount).toLocaleString('it-IT')} new budget${overAmount > 0 ? ` • €${Math.round(overAmount).toLocaleString('it-IT')} beyond budget` : ''}</div>
          </div>
        </div>
      `;
    }

    function renderTable() {
      const { byTask: trackedByTask, frozenByTask, datesByTask } = computeTracked();

      // Execution date = when the work was actually logged in the calendar.
      // One day → "24/07/2026"; several → "24/07/2026 → 12/08/2026".
      const executionDateOf = t => {
        const dates = (datesByTask[t.id] || []).slice().sort();
        if (!dates.length) return t.executionDate ? fmtEU(t.executionDate) : '—';
        const first = dates[0], last = dates[dates.length - 1];
        return first === last ? fmtEU(first) : fmtEU(first) + ' → ' + fmtEU(last);
      };
      const match = t => !term || t.name.toLowerCase().includes(term.toLowerCase());
      let filtered = tasks.filter(match);

      if (view !== "all") {
        filtered = filtered.filter(t => t.status === view);
      }

      if (!filtered.length) {
        return renderStats() + '<div class="empty">No tasks found.</div>';
      }

      let html = renderStats();

      // Group by section
      const sections = [
        { key: "new-realloc", title: "New Production", desc: "34h reallocated from First Estimation + 25h PM earmarked for coordination — the remaining 38h are new budget (€3.230). Calendar hours logged up to " + fmtEU(INVOICE_CUTOFF) + " are settled (invoiced & paid); anything later shows as tracked." },
        { key: "approved", title: "First Estimation", desc: "Original scope — budgeted deliverables" }
      ];

      sections.forEach(section => {
        const sectionTasks = filtered.filter(t => t.section === section.key);
        if (sectionTasks.length === 0) return;

        const sectionBudget = sectionTasks.reduce((s, t) => s + t.budgetHours, 0);
        const sectionAmount = sectionTasks.reduce((s, t) => s + t.amountRemaining, 0);

        // A search must not hide its own results inside a collapsed section.
        const isOpen = term ? true : openSections[section.key];
        html += `<details class="section" data-section="${section.key}"${isOpen ? ' open' : ''}>
          <summary>
            <span class="chev">▶</span>
            <h3 style="margin: 0; font-size: 16px; font-weight: 600; color: var(--text);">${section.title}</h3>
            <span style="background: var(--orange); color: #1a0d04; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600;">${sectionBudget}h</span>
          </summary>
          <p class="section-desc">${section.desc}</p>`;

        html += '<div class="table-wrap"><table>' +
          '<thead><tr>' +
          '<th style="min-width: 280px">Deliverable / Task</th>' +
          '<th style="min-width: 120px">Execution Date</th>' +
          '<th style="min-width: 200px">Hours</th>' +
          '<th style="min-width: 120px">Hourly Rate</th>' +
          '<th style="min-width: 200px">Amount (excl. VAT)</th>' +
          '<th style="min-width: 140px">Status</th>' +
          '<th style="min-width: 180px">Notes</th>' +
          '</tr></thead><tbody>';

        sectionTasks.forEach(t => {
          const status = statusOf(t.status);

          // Hours logged in the calendar eat into the budget on top of what
          // has already been invoiced, so the remaining figure nets out both.
          const frozen = frozenByTask[t.id] || 0;      // calendar hours ≤ cut-off: settled
          const tracked = trackedByTask[t.id] || 0;    // calendar hours after cut-off
          const invoicedHours = t.invoicedHours + frozen;
          const consumed = invoicedHours + tracked;
          const remaining = round1(t.budgetHours - consumed);
          const overHours = overHoursOf(t, consumed);
          const overAmount = overAmountOf(t, consumed);  // billed to the client
          const noBudget = t.budgetHours === 0;          // catch-all bucket

          const invoicedPercent = t.budgetHours > 0 ? (invoicedHours / t.budgetHours) * 100 : 0;
          const trackedPercent = t.budgetHours > 0 ? (tracked / t.budgetHours) * 100 : 0;
          // The two segments share the bar, so cap their sum at 100%.
          const invoicedWidth = Math.min(invoicedPercent, 100);
          const trackedWidth = Math.min(trackedPercent, 100 - invoicedWidth);

          html += '<tr data-task-id="' + t.id + '">' +
            '<td><span class="task-name">' + t.name + '</span></td>' +
            '<td style="font-size: 12px; color: var(--muted); text-align: center; white-space: nowrap;">' + executionDateOf(t) + '</td>' +
            '<td>' +
            '<div class="hours-cell">' +
            '<div class="hours-numbers">' +
            '<span class="hours-budget">' + round1(consumed) + '/' + t.budgetHours + 'h</span>' +
            (frozen > 0
              ? '<span class="hours-invoiced" title="Calendar hours logged up to ' + fmtEU(INVOICE_CUTOFF) + ' — invoiced & paid">✓ ' + round1(invoicedHours) + 'h paid</span>'
              : '') +
            (tracked > 0
              ? '<span class="hours-tracked" title="Logged in Google Calendar from July 22 onwards, not yet invoiced">◷ ' + round1(tracked) + 'h tracked</span>'
              : '') +
            '<span class="hours-remaining' + (remaining < 0 ? ' over' : '') + '">' +
            (remaining >= 0 ? '✓ ' : (noBudget ? '' : '✗ ')) + Math.abs(remaining) + 'h ' +
            (remaining >= 0 ? 'left' : (noBudget ? 'logged' : 'over')) +
            '</span>' +
            '</div>' +
            '<div class="hours-progress" title="' + round1(invoicedHours) + 'h invoiced' + (frozen > 0 ? ' (incl. ' + round1(frozen) + 'h from calendar up to ' + fmtEU(INVOICE_CUTOFF) + ')' : '') + (tracked > 0 ? ' + ' + round1(tracked) + 'h tracked' : '') + ' of ' + t.budgetHours + 'h">' +
            '<div class="hours-progress-fill" style="width: ' + invoicedWidth + '%"></div>' +
            '<div class="hours-progress-tracked" style="width: ' + trackedWidth + '%"></div>' +
            '</div>' +
            '</div>' +
            '</td>' +
            '<td>€' + t.hourlyRate.toLocaleString('it-IT') + '</td>' +
            '<td>' +
            '<div><span class="amount-invoiced">€' + t.amountInvoiced.toLocaleString('it-IT') + '</span></div>' +
            (t.amountRemaining > 0 ? '<div><span class="amount-remaining">€' + t.amountRemaining.toLocaleString('it-IT') + '</span></div>' : '') +
            (overAmount > 0 ? '<div><span style="color: var(--c-over); font-weight: 600;" title="' + overHours + 'h ' + (noBudget ? 'logged' : 'beyond budget') + ' × €' + t.hourlyRate + '/h — billed to the client">+€' + overAmount.toLocaleString('it-IT') + (noBudget ? ' billed' : ' beyond budget') + '</span></div>' : '') +
            '</td>' +
            '<td><span class="status-badge ' + t.status + '">' + status.emoji + ' ' + status.label.split(' ')[1] + '</span></td>' +
            '<td><span class="ferma-cell" data-task-id="' + t.id + '" style="font-size: 11px; color: var(--muted); cursor: pointer; padding: 4px 8px; border-radius: 4px; display: inline-block; min-width: 160px; white-space: normal;" title="Double-click to edit">' + (t.ferma || '') + '</span></td>' +
            '</tr>';
        });

        // Add totals row
        const totalFrozen = sectionTasks.reduce((s, t) => s + (frozenByTask[t.id] || 0), 0);
        const totalInvoiced = sectionTasks.reduce((s, t) => s + t.invoicedHours, 0) + totalFrozen;
        const totalTracked = sectionTasks.reduce((s, t) => s + (trackedByTask[t.id] || 0), 0);
        const totalBudget = sectionTasks.reduce((s, t) => s + t.budgetHours, 0);
        const totalOverAmount = sectionTasks.reduce((s, t) =>
          s + overAmountOf(t, t.invoicedHours + (frozenByTask[t.id] || 0) + (trackedByTask[t.id] || 0)), 0);
        const totalAmount = sectionTasks.reduce((s, t) => s + t.amountInvoiced + t.amountRemaining, 0) + totalOverAmount;

        html += '<tr style="background: var(--panel-2); font-weight: 600; border-top: 2px solid var(--line);">' +
          '<td style="color: var(--orange);">TOTAL</td>' +
          '<td style="color: var(--orange);">' + round1(totalInvoiced + totalTracked) + '/' + totalBudget + 'h' +
          (totalFrozen > 0 ? '<span class="hours-invoiced" style="display: block; font-weight: 500; font-size: 11px;">✓ ' + round1(totalFrozen) + 'h from calendar · paid</span>' : '') +
          (totalTracked > 0 ? '<span class="hours-tracked" style="display: block; font-weight: 500;">incl. ' + round1(totalTracked) + 'h tracked</span>' : '') +
          '</td>' +
          '<td></td>' +
          '<td style="color: var(--text);">€' + Math.round(totalAmount) +
          (totalOverAmount > 0 ? '<span style="display: block; font-size: 11px; font-weight: 500; color: var(--c-over);">incl. €' + Math.round(totalOverAmount) + ' beyond budget</span>' : '') +
          '</td>' +
          '<td></td>' +
          '<td></td>' +
          '</tr>';

        html += '</tbody></table></div></details>';
      });

      // Attach edit handlers after rendering
      function attachFermaEditors() {
        document.querySelectorAll('.ferma-cell').forEach(cell => {
          cell.addEventListener('dblclick', function() {
            // Number(), not parseInt(): task id 3.5 would become 3 and the
            // note would be written onto a different deliverable.
            const taskId = Number(this.dataset.taskId);
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            const currentValue = task.ferma || '';
            const input = document.createElement('input');
            input.type = 'text';
            input.value = currentValue;
            input.style.cssText = 'width: 100%; padding: 4px 8px; background: var(--panel); border: 1px solid var(--orange); color: var(--text); border-radius: 4px; font-size: 11px;';

            const span = this;
            let saved = false;
            const saveEdit = () => {
              if (saved) return;   // blur also fires after Enter
              saved = true;
              task.ferma = input.value;
              saveNote(task.id, task.ferma);
              span.textContent = task.ferma || '';
              input.replaceWith(span);
              attachFermaEditors();
            };

            input.addEventListener('blur', saveEdit);
            input.addEventListener('keypress', (e) => {
              if (e.key === 'Enter') saveEdit();
            });

            span.replaceWith(input);
            input.focus();
            input.select();
          });
        });
      }
      setTimeout(attachFermaEditors, 0);

      return html;
    }

    let timeEntries = [];
    // 🔗 Google Apps Script Deployment URL (optional - for auto-sync)
    // Same-origin Vercel function (see api/calendar.js) that proxies the Google
    // Apps Script. The Apps Script URL lives there — update it there after a redeploy.
    const GOOGLE_CALENDAR_SYNC_URL = '/api/calendar';

    function render() {
      renderNav();
      renderLegend();
      const ct = $("#content");
      ct.innerHTML = renderTable() + renderTimesheet() + '<div class="ai-badge">Created by White Rabbit with AI assistance</div>';

      // Sync button handler
      const syncBtn = document.getElementById('syncCalendar');
      if (syncBtn) syncBtn.addEventListener('click', syncFromGoogleCalendar);

      // Refresh button handler
      const refreshBtn = document.getElementById('refreshTimesheet');
      if (refreshBtn) refreshBtn.addEventListener('click', refreshTimesheet);

      // Copy this browser's entry → task assignments (baked map + local overrides)
      const copyBtn = document.getElementById('copyAssignments');
      if (copyBtn) copyBtn.addEventListener('click', () => {
        const json = JSON.stringify(loadEntryMap(), null, 2);
        const done = () => toast('Assignments copied — paste them to Claude to bake them in');
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(json).then(done, () => prompt('Copy the assignments:', json));
        } else {
          prompt('Copy the assignments:', json);
        }
      });

      // Remember expanded/collapsed sections across re-renders
      document.querySelectorAll('details.section').forEach(d => {
        // Skip while searching: that open state is forced, not the user's choice.
        d.addEventListener('toggle', () => { if (!term) openSections[d.dataset.section] = d.open; });
      });

      // Entry → task assignment handlers
      document.querySelectorAll('select.entry-map').forEach(sel => {
        sel.addEventListener('change', function() {
          // Number(), not parseInt(): one task id is 3.5 and would be
          // truncated to 3, silently charging the hours to another task.
          const taskId = this.value === '' ? null : Number(this.value);
          setEntryOverride(this.dataset.norm, taskId);
          render();
        });
      });

    }

    // The endpoint is fixed (see GOOGLE_CALENDAR_SYNC_URL) — no prompt, no
    // localStorage: a stale saved URL was silently pointing at an old deploy.
    function syncFromGoogleCalendar() {
      fetch(GOOGLE_CALENDAR_SYNC_URL, { cache: 'no-store' })
        .then(r => r.text().then(text => {
          // Parse by hand so a bad body yields a readable error instead of
          // Safari's generic "The string did not match the expected pattern".
          try { return JSON.parse(text); }
          catch (_) { throw new Error('HTTP ' + r.status + ', non-JSON body: ' + text.slice(0, 80)); }
        }))
        .then(data => {
          if (!data.success) throw new Error(data.error || 'sync failed');
          timeEntries = data.events || [];
          render();
          toast('✓ Synced ' + timeEntries.length + ' events from Google Calendar');
        })
        .catch(e => {
          console.error('Sync error:', e);
          toast('Could not sync calendar: ' + e.message);
        });
    }
    const refreshTimesheet = syncFromGoogleCalendar;

    function renderTimesheet() {
      const { matchOf, unmatched, byTask, frozenByTask } = computeTracked();
      const sum = o => Object.values(o).reduce((a, b) => a + b, 0);
      const paidTotal = round1(sum(frozenByTask));   // assigned & settled
      const openTotal = round1(sum(byTask));         // assigned, after cut-off

      // Keep the original index alongside each entry so we can look up which
      // task it was matched to, then sort by date (newest first).
      const sortedEntries = timeEntries
        .map((entry, i) => ({ entry, matchedId: matchOf[i] }))
        .sort((a, b) => new Date(b.entry.date) - new Date(a.entry.date));

      const totalAllHours = round1(
        timeEntries.reduce((s, e) => s + (Number(e.hours) || 0), 0)
      );

      let html = '<div class="timesheet-section"><h3 style="margin-bottom: 16px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px;">⏱ TIME TRACKING (From July 22 Onwards)</h3>';
      html += '<div style="display: flex; gap: 8px; margin-bottom: 16px; align-items: center;">';
      html += '<button id="syncCalendar" style="padding: 8px 14px; background: var(--orange); color: var(--bg); border: none; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer;">↻ Sync from Google Calendar</button>';
      html += '<button id="refreshTimesheet" style="padding: 8px 14px; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer;">⟳ Refresh</button>';
      html += '<button id="copyAssignments" title="Copy this browser\'s entry → task assignments as JSON, to bake them into the dashboard" style="padding: 8px 14px; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; margin-left: auto;">⧉ Copy assignments</button>';
      html += '</div>';
      html += '<p style="font-size: 12px; color: var(--muted); margin-bottom: 14px;"><span style="color: var(--c-paid);">✓</span> = settled: logged up to <strong>' + fmtEU(INVOICE_CUTOFF) + '</strong>, invoiced &amp; paid. Later entries count as tracked, not yet invoiced.</p>';

      if (timeEntries.length === 0) {
        html += '<p style="color: var(--muted); font-size: 12px;">No FRM time entries from July 22 onwards. Click "Sync from Google Calendar" to import events.</p>';
      } else {
        if (unmatched.length) {
          html += '<p style="font-size: 12px; color: var(--c-over); background: rgba(236, 72, 153, 0.08); border: 1px solid var(--c-over); border-radius: 6px; padding: 10px 12px; margin-bottom: 14px;">⚠ ' +
            unmatched.length + ' calendar entr' + (unmatched.length === 1 ? 'y is' : 'ies are') +
            ' not assigned to a task, so ' + (unmatched.length === 1 ? 'its' : 'their') +
            ' hours are <strong>not</strong> deducted from any budget. Pick the right deliverable in the “Deducted From” column — the choice is remembered for every future event with the same title. Only <strong>New Production</strong> deliverables can be selected; First Estimation hours are closed and never touched.</p>';
        }

        html += '<div class="timesheet-table"><table style="width: 100%; border-collapse: collapse; font-size: 12px;">';
        html += '<tr style="border-bottom: 1px solid var(--line);"><th style="text-align: left; padding: 8px; color: var(--muted); font-weight: 500;">Date</th><th style="text-align: left; padding: 8px; color: var(--muted); font-weight: 500;">Calendar Entry</th><th style="text-align: left; padding: 8px; color: var(--muted); font-weight: 500;">Deducted From</th><th style="text-align: right; padding: 8px; color: var(--muted); font-weight: 500;">Hours</th></tr>';

        // Show entries sorted by date (newest first). The target task is a
        // dropdown so a title the matcher could not place can be assigned by
        // hand — the choice sticks for every event with the same title.
        sortedEntries.forEach(({ entry, matchedId }) => {
          const normTitle = normalizeName(entry.taskName);
          const paid = !!entry.date && entry.date <= INVOICE_CUTOFF;
          // New Production deliverables only — First Estimation is closed work.
          const options = ['<option value=""' + (matchedId == null ? ' selected' : '') + '>— not counted —</option>']
            .concat(trackableTasks().map(t =>
              '<option value="' + t.id + '"' + (t.id === matchedId ? ' selected' : '') + '>' + t.name + '</option>'
            )).join('');

          html += '<tr style="border-bottom: 1px solid var(--line);">' +
            '<td style="padding: 8px; color: var(--muted); font-size: 11px; white-space: nowrap;">' + fmtEU(entry.date) + '</td>' +
            '<td style="padding: 8px; color: var(--text);">' + entry.taskName + '</td>' +
            '<td style="padding: 8px;">' +
            '<select class="entry-map" data-norm="' + normTitle.replace(/"/g, '&quot;') + '" ' +
            'style="width: 100%; max-width: 260px; padding: 4px 6px; font-size: 11px; border-radius: 4px; background: var(--panel); color: ' +
            (matchedId == null ? 'var(--c-over)' : 'var(--c-tracked)') + '; border: 1px solid ' +
            (matchedId == null ? 'var(--c-over)' : 'var(--line)') + ';">' + options + '</select>' +
            '</td>' +
            '<td style="text-align: right; padding: 8px; white-space: nowrap; color: ' + (paid ? 'var(--c-paid)' : 'var(--orange)') + ';"' +
            (paid ? ' title="Settled — invoiced & paid (cut-off ' + fmtEU(INVOICE_CUTOFF) + ')"' : '') + '>' +
            entry.hours + 'h' + (paid ? ' ✓' : '') + '</td></tr>';
        });

        // Show grand total, split by settled / open / not counted
        const notCounted = round1(totalAllHours - paidTotal - openTotal);
        html += '<tr style="background: var(--panel-2); font-weight: 600; border-top: 2px solid var(--line);"><td style="padding: 8px;"></td><td style="padding: 8px; color: var(--text);">TOTAL (From July 22 Onwards)</td><td style="padding: 8px;"></td><td style="text-align: right; padding: 8px; color: var(--orange);">' + totalAllHours + 'h</td></tr>';
        html += '<tr style="background: var(--panel-2); font-size: 11px;"><td style="padding: 4px 8px 10px;"></td><td style="padding: 4px 8px 10px; color: var(--muted);">' +
          '<span style="color: var(--c-paid);">✓ ' + paidTotal + 'h settled (≤ ' + fmtEU(INVOICE_CUTOFF) + ')</span> · ' +
          '<span style="color: var(--c-tracked);">' + openTotal + 'h tracked, not invoiced</span>' +
          (notCounted > 0 ? ' · <span style="color: var(--c-over);">' + notCounted + 'h not assigned to any task</span>' : '') +
          '</td><td></td><td></td></tr>';
        html += '</table></div>';
      }
      html += '</div>';
      return html;
    }

    $("#search").oninput = (e) => {
      term = e.target.value;
      render();
    };

    render();
    syncFromGoogleCalendar();   // re-renders once the calendar answers
  </script>

  <style>
    .ai-badge {
      margin: 40px 0 8px auto;
      width: fit-content;
      background: #d4c4b0;
      color: #2a2420;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
    }

    .timesheet-section {
      margin-top: 40px;
      padding: 20px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .timesheet-section button {
      transition: all 0.2s ease;
    }

    .timesheet-section button:hover {
      background: var(--orange-soft) !important;
      transform: translateY(-1px);
    }

    .timesheet-table {
      overflow-x: auto;
    }

    .timesheet-table table tr:hover {
      background: var(--panel-2);
    }
  </style>
</body>
</html>
