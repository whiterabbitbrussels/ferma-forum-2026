<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FERMA Forum 2026 — Project Dashboard</title>
  <style>
    :root {
      --bg: #0f0e0d;
      --panel: #171513;
      --panel-2: #211e1b;
      --card: #1f1c19;
      --line: #332e29;
      --text: #f4efe9;
      --muted: #9a918a;
      --orange: #ff6a13;
      --orange-soft: #ff8a44;
      --c-paid: #22c55e;
      --c-pending: #f59e0b;
      --c-not-started: #ef4444;
      --c-over: #ec4899;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      min-height: 100%;
    }

    a {
      color: var(--orange-soft);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 268px;
      flex: none;
      background: var(--panel);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
    }

    .side-head {
      padding: 22px 20px 18px;
      border-bottom: 1px solid var(--line);
      flex: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 0 12px var(--orange);
    }

    .brand h1 {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
    }

    .side-head .sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }

    nav {
      padding: 14px 12px;
      overflow-y: auto;
      flex: 1;
    }

    .nav-label {
      font-size: 10px;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 14px 10px 7px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 10px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      user-select: none;
      transition: 0.13s;
      border: 1px solid transparent;
    }

    .nav-item:hover {
      background: var(--panel-2);
    }

    .nav-item.on {
      background: var(--panel-2);
      border-color: var(--line);
    }

    .nav-item.on .nav-name {
      font-weight: 650;
    }

    .nav-ico {
      width: 20px;
      text-align: center;
      flex: none;
      font-size: 13px;
    }

    .nav-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-count {
      font-size: 11px;
      color: var(--muted);
      background: var(--bg);
      padding: 2px 8px;
      border-radius: 20px;
      flex: none;
    }

    .legend {
      padding: 13px 18px 15px;
      border-top: 1px solid var(--line);
      flex: none;
    }

    .legend-title {
      font-size: 10px;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 9px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 11.5px;
      margin: 6px 0;
    }

    .legend-sw {
      width: 12px;
      height: 12px;
      border-radius: 4px;
      flex: none;
    }

    /* ===== MAIN ===== */
    main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .topbar {
      padding: 20px 30px 16px;
      border-bottom: 1px solid var(--line);
      flex: none;
      background: linear-gradient(180deg, #161412, #0f0e0d);
    }

    .crumb {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .view-title {
      font-size: 21px;
      font-weight: 700;
      margin: 5px 0 3px;
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .view-bar {
      width: 30px;
      height: 5px;
      border-radius: 3px;
    }

    .view-desc {
      font-size: 12.5px;
      color: var(--muted);
    }

    #search {
      margin-top: 13px;
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 9px 13px;
      border-radius: 9px;
      font-size: 13.5px;
    }

    #search:focus {
      outline: none;
      border-color: var(--orange);
    }

    .scroll {
      overflow-y: auto;
      padding: 22px 30px 70px;
      flex: 1;
    }

    /* ===== STATS ===== */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .stat-box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }

    .stat-desc {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    .progress-bar {
      background: var(--panel);
      height: 6px;
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--orange) 0%, var(--orange-soft) 100%);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    /* ===== TABLE ===== */
    .table-wrap {
      overflow-x: auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead {
      background: var(--panel-2);
      border-bottom: 1px solid var(--line);
    }

    th {
      padding: 14px 16px;
      text-align: left;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 10px;
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid var(--line);
      transition: 0.13s;
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    td {
      padding: 14px 16px;
      vertical-align: middle;
    }

    .task-name {
      font-weight: 500;
      color: var(--text);
      max-width: 280px;
    }

    .hours-cell {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hours-numbers {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 12px;
    }

    .hours-budget {
      color: var(--muted);
    }

    .hours-invoiced {
      color: var(--orange-soft);
      font-weight: 600;
    }

    .hours-remaining {
      color: var(--muted);
      font-size: 11px;
    }

    .hours-remaining.over {
      color: var(--c-over);
      font-weight: 600;
    }

    .hours-progress {
      width: 120px;
      height: 24px;
      background: var(--panel);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--line);
    }

    .hours-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--orange) 0%, var(--orange-soft) 100%);
      transition: width 0.3s ease;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: 0.13s;
      border: 1px solid;
      white-space: nowrap;
    }

    .status-badge.paid {
      background: rgba(34, 197, 94, 0.1);
      color: var(--c-paid);
      border-color: #1d3d27;
    }

    .status-badge.paid:hover {
      background: rgba(34, 197, 94, 0.2);
    }

    .status-badge.pending {
      background: rgba(245, 158, 11, 0.1);
      color: var(--c-pending);
      border-color: #3d2d1a;
    }

    .status-badge.pending:hover {
      background: rgba(245, 158, 11, 0.2);
    }

    .status-badge.not-started {
      background: rgba(239, 68, 68, 0.1);
      color: var(--c-not-started);
      border-color: #3d1d1d;
    }

    .status-badge.not-started:hover {
      background: rgba(239, 68, 68, 0.2);
    }

    .status-badge.over {
      background: rgba(236, 72, 153, 0.1);
      color: var(--c-over);
      border-color: #3d1d2d;
    }

    .status-badge.over:hover {
      background: rgba(236, 72, 153, 0.2);
    }

    .amount-invoiced {
      font-weight: 600;
      color: var(--text);
    }

    .amount-remaining {
      color: var(--text);
      font-weight: 500;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--orange);
      color: #1a0d04;
      padding: 11px 22px;
      border-radius: 9px;
      font-weight: 600;
      font-size: 13px;
      opacity: 0;
      transition: 0.25s;
      pointer-events: none;
      z-index: 9;
    }

    .toast.show {
      opacity: 1;
    }

    @media (max-width: 780px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: auto;
        position: static;
        border-right: none;
        border-bottom: 1px solid var(--line);
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      main {
        height: auto;
      }

      .scroll {
        overflow: visible;
      }

      th, td {
        padding: 10px 8px;
        font-size: 12px;
      }
    }
  </style>

    function toast(m) {
      const t = $("#toast");
      t.textContent = m;
      t.classList.add("show");
      clearTimeout(t._t);
      t._t = setTimeout(() => t.classList.remove("show"), 1900);
    }

    function renderNav() {
      let h = '<div class="nav-label">View</div>' +

      h += '<div class="nav-label">By Status</div>';
      STATUSES.forEach(s => {
        const n = tasks.filter(t => t.status === s.key).length;
        if (n > 0) h += navItem(s.key, s.emoji, s.label, n);
      });

      const nav = $("#nav");
      nav.innerHTML = h;
      nav.querySelectorAll(".nav-item").forEach(it => it.onclick = () => {
        view = it.dataset.view;
        term = "";
        $("#search").value = "";
        render();
      });
    }

    function navItem(v, ico, name, count) {
      const on = view === v ? " on" : "";
      return '<div class="nav-item' + on + '" data-view="' + v + '">' +
        '<span class="nav-ico">' + ico + '</span>' +
        '<span class="nav-name">' + name + '</span>' +
        '<span class="nav-count">' + count + '</span></div>';
    }

    function renderLegend() {
      let h = '<div class="legend-title">Status Guide</div>';
      STATUSES.forEach(s => {
        h += '<div class="legend-row"><span class="legend-sw" style="background:' + s.color + '"></span>' +
          s.label + '</div>';
      });
      $("#legend").innerHTML = h;
    }

    function renderStats() {
      const approved = tasks.filter(t => t.section === "approved");
      const newRealloc = tasks.filter(t => t.section === "new-realloc");

      const approvedBudget = approved.reduce((s, t) => s + t.budgetHours, 0);
      const approvedInvoiced = approved.reduce((s, t) => s + t.invoicedHours, 0);
      const approvedRemaining = approved.reduce((s, t) => s + t.remainingHours, 0);

      const newReallocBudget = newRealloc.reduce((s, t) => s + t.budgetHours, 0);

      // Production work in New Production, excluding the PM Coordination line (billed €0)
      const newReallocPaid = newRealloc.filter(t => t.amountRemaining > 0).reduce((s, t) => s + t.budgetHours, 0);

      // The 25h of PM still open are earmarked for the New Production PM Coordination line,
      // so they are NOT available to fund production work. Only the rest can be reallocated:
      // Design 25h + PPT 2h + Leaflet 8h + Flyer 4h - Animation 5h over = 34h
      const pmEarmarkedHours = 25;
      const reallocatedHours = approvedRemaining - pmEarmarkedHours;
      const newBudgetHours = Math.max(0, newReallocPaid - reallocatedHours);
      const newBudgetAmount = newBudgetHours * 85;

      // Still to bill on the approved budget (the 59h left, net of the Animation overrun)
      const originalPending = approved.reduce((s, t) => s + t.amountRemaining, 0);

      const totalAmountInvoiced = tasks.reduce((s, t) => s + t.amountInvoiced, 0);

      return `
        <div class="stats">
          <div class="stat-box">
            <div class="stat-label">Approved Budget</div>
            <div class="stat-value">${approvedBudget}h</div>
            <div class="stat-desc">Original scope (${approvedInvoiced}h invoiced)</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Available to Reallocate</div>
            <div class="stat-value">${reallocatedHours}h</div>
            <div class="stat-desc">Design 25h + PPT 2h + Leaflet 8h + Flyer 4h − Animation 5h over. PM 25h stay earmarked for coordination.</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">New Production</div>
            <div class="stat-value">${newReallocBudget}h</div>
            <div class="stat-desc">${reallocatedHours}h reallocated + ${pmEarmarkedHours}h PM earmarked + ${newBudgetHours}h to approve</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">New Budget to Approve</div>
            <div class="stat-value">€${Math.round(newBudgetAmount).toLocaleString('it-IT')}</div>
            <div class="stat-desc">${newBudgetHours}h @ €85/h not covered by reallocation</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Total Project Value</div>
            <div class="stat-value">€${Math.round(totalAmountInvoiced + originalPending + newBudgetAmount).toLocaleString('it-IT')}</div>
            <div class="stat-desc">€${totalAmountInvoiced.toLocaleString('it-IT')} invoiced • €${Math.round(originalPending).toLocaleString('it-IT')} pending (approved) • €${Math.round(newBudgetAmount).toLocaleString('it-IT')} to approve</div>
          </div>
        </div>
      `;
    }

    function renderTable() {
      const match = t => !term || t.name.toLowerCase().includes(term.toLowerCase());
      let filtered = tasks.filter(match);

      if (view !== "all") {
        filtered = filtered.filter(t => t.status === view);
      }

      if (!filtered.length) {
        return renderStats() + '<div class="empty">No tasks found.</div>';
      }

      let html = renderStats();

      // Group by section
      const sections = [
        { key: "new-realloc", title: "New Production", desc: "34h reallocated from First Estimation + 25h PM earmarked for coordination — the remaining 38h require approval (€3.230)" },
        { key: "approved", title: "First Estimation", desc: "Already budgeted & approved deliverables" }
      ];

      sections.forEach(section => {
        const sectionTasks = filtered.filter(t => t.section === section.key);
        if (sectionTasks.length === 0) return;

        const sectionBudget = sectionTasks.reduce((s, t) => s + t.budgetHours, 0);
        const sectionAmount = sectionTasks.reduce((s, t) => s + t.amountRemaining, 0);

        html += `<div style="margin: 30px 0 20px 0;">
          <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
            <h3 style="margin: 0; font-size: 16px; font-weight: 600; color: var(--text);">${section.title}</h3>
            <span style="background: var(--orange); color: #1a0d04; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600;">${sectionBudget}h</span>
          </div>
          <p style="margin: 0 0 16px 0; font-size: 12px; color: var(--muted);">${section.desc}</p>
        </div>`;

        html += '<div class="table-wrap"><table>' +
          '<thead><tr>' +
          '<th style="min-width: 280px">Deliverable / Task</th>' +
          '<th style="min-width: 200px">Hours</th>' +
          '<th style="min-width: 120px">Hourly Rate</th>' +
          '<th style="min-width: 200px">Amount (excl. VAT)</th>' +
          '<th style="min-width: 140px">Status</th>' +
          '<th style="min-width: 180px">Notes</th>' +
          '</tr></thead><tbody>';

        sectionTasks.forEach(t => {
          const status = statusOf(t.status);
          const progressPercent = t.budgetHours > 0 ? Math.round((t.invoicedHours / t.budgetHours) * 100) : 0;

          html += '<tr data-task-id="' + t.id + '">' +
            '<td><span class="task-name">' + t.name + '</span></td>' +
            '<td>' +
            '<div class="hours-cell">' +
            '<div class="hours-numbers">' +
            '<span class="hours-budget">' + t.invoicedHours + '/' + t.budgetHours + 'h</span>' +
            '<span class="hours-remaining' + (t.remainingHours < 0 ? ' over' : '') + '">' +
            (t.remainingHours >= 0 ? '✓ ' : '✗ ') + Math.abs(t.remainingHours) + 'h ' +
            (t.remainingHours >= 0 ? 'left' : 'over') +
            '</span>' +
            '</div>' +
            '<div class="hours-progress">' +
            '<div class="hours-progress-fill" style="width: ' + Math.min(progressPercent, 100) + '%"></div>' +
            '</div>' +
            '</div>' +
            '</td>' +
            '<td>€' + t.hourlyRate.toLocaleString('it-IT') + '</td>' +
            '<td>' +
            '<div><span class="amount-invoiced">€' + t.amountInvoiced.toLocaleString('it-IT') + '</span></div>' +
            (t.amountRemaining > 0 ? '<div><span class="amount-remaining">€' + t.amountRemaining.toLocaleString('it-IT') + '</span></div>' : '') +
            '</td>' +
            '<td><span class="status-badge ' + t.status + '">' + status.emoji + ' ' + status.label.split(' ')[1] + '</span></td>' +
            '<td><span class="ferma-cell" data-task-id="' + t.id + '" style="font-size: 11px; color: var(--muted); cursor: pointer; padding: 4px 8px; border-radius: 4px; display: inline-block; min-width: 160px; white-space: normal;" title="Double-click to edit">' + (t.ferma || '') + '</span></td>' +
            '</tr>';
        });

        // Add totals row
        const totalInvoiced = sectionTasks.reduce((s, t) => s + t.invoicedHours, 0);
        const totalBudget = sectionTasks.reduce((s, t) => s + t.budgetHours, 0);
        const totalAmount = sectionTasks.reduce((s, t) => s + t.amountInvoiced + t.amountRemaining, 0);

        html += '<tr style="background: var(--panel-2); font-weight: 600; border-top: 2px solid var(--line);">' +
          '<td style="color: var(--orange);">TOTAL</td>' +
          '<td style="color: var(--orange);">' + totalInvoiced + '/' + totalBudget + 'h</td>' +
          '<td></td>' +
          '<td style="color: var(--text);">€' + Math.round(totalAmount) + '</td>' +
          '<td></td>' +
          '<td></td>' +
          '</tr>';

        html += '</tbody></table></div>';
      });

      // Attach edit handlers after rendering
      function attachFermaEditors() {
        document.querySelectorAll('.ferma-cell').forEach(cell => {
          cell.addEventListener('dblclick', function() {
            const taskId = parseInt(this.dataset.taskId);
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            const currentValue = task.ferma || '';
            const input = document.createElement('input');
            input.type = 'text';
            input.value = currentValue;
            input.style.cssText = 'width: 100%; padding: 4px 8px; background: var(--panel); border: 1px solid var(--orange); color: var(--text); border-radius: 4px; font-size: 11px;';

            const span = this;
            const saveEdit = () => {
              task.ferma = input.value;
              span.textContent = task.ferma || '';
              input.replaceWith(span);
              attachFermaEditors();
            };

            input.addEventListener('blur', saveEdit);
            input.addEventListener('keypress', (e) => {
              if (e.key === 'Enter') saveEdit();
            });

            span.replaceWith(input);
            input.focus();
            input.select();
          });
        });
      }
      setTimeout(attachFermaEditors, 0);

      return html;
    }

    let timeEntries = [];
    // 🔗 Google Apps Script Deployment URL (optional - for auto-sync)
    const GOOGLE_CALENDAR_SYNC_URL = 'https://script.google.com/macros/s/AKfycbzjiuZOr3uo9Lum7lHpQzn9CsAefPlfdZplxJ33BFSkhrsDU9AVkdcb4drVgDmf4t7B/exec';

    function render() {
      renderNav();
      renderLegend();
      const ct = $("#content");
      ct.innerHTML = renderTable() + renderTimesheet() + '<div class="ai-badge">Created by White Rabbit with AI assistance</div>';

      // Sync button handler
      document.getElementById('syncCalendar').addEventListener('click', syncFromGoogleCalendar);
    }

    function syncFromGoogleCalendar() {
      const calendarId = prompt('Enter your Google Calendar ID or URL (or press Cancel to manually paste events):\n\nFor automated sync, set up a webhook using n8n or Google Apps Script that posts events to an endpoint.');

      if (calendarId === null) {
        // Manual paste mode
        const jsonStr = prompt('Paste your Google Calendar events as JSON:\n\nFormat: [{"taskName":"Task Name","date":"2026-08-12","hours":2,"description":"Notes"}]');
        if (jsonStr) {
          try {
            const parsed = JSON.parse(jsonStr);
            timeEntries = Array.isArray(parsed) ? parsed : [parsed];
            render();
            alert('Events imported successfully! Total entries: ' + timeEntries.length);
          } catch (e) {
            alert('Invalid JSON format. Please try again.');
          }
        }
        return;
      }

      // Try to fetch from endpoint (for automated setup)
      if (calendarId.trim()) {
        const endpoint = calendarId.startsWith('http') ? calendarId : 'https://script.google.com/macros/d/' + calendarId + '/usercopy';
        fetch(endpoint)
          .then(r => r.json())
          .then(data => {
            timeEntries = data.events || data || [];
            render();
            alert('Synced ' + timeEntries.length + ' events from Google Calendar');
          })
          .catch(e => {
            console.error('Sync error:', e);
            alert('Could not sync calendar. Make sure the endpoint is accessible. You can still paste events manually.');
          });
      }
    }

    function getTimeEntriesForTask(taskId) {
      return timeEntries.filter(e => {
        if (e.taskId === taskId) return true;
        const task = tasks.find(t => t.id === taskId);
        if (!task) return false;
        return e.taskName && task.name && e.taskName.toLowerCase().includes(task.name.toLowerCase());
      });
    }

    function renderTimesheet() {
      // Group entries by task name
      const entriesByTask = {};
      let totalAllHours = 0;

      timeEntries.forEach(entry => {
        const taskName = entry.taskName || 'Unknown Task';
        if (!entriesByTask[taskName]) {
          entriesByTask[taskName] = { entries: [], totalHours: 0 };
        }
        const hours = entry.hours || 0;
        entriesByTask[taskName].entries.push(entry);
        entriesByTask[taskName].totalHours += hours;
        totalAllHours += hours;
      });

      let html = '<div class="timesheet-section"><h3 style="margin-bottom: 16px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px;">⏱ TIME TRACKING (Last 30 Days)</h3>';
      html += '<button id="syncCalendar" style="margin-bottom: 16px; padding: 8px 14px; background: var(--orange); color: var(--bg); border: none; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer;">↻ Sync from Google Calendar</button>';

      if (timeEntries.length === 0) {
        html += '<p style="color: var(--muted); font-size: 12px;">No FRM time entries in the last 30 days. Click "Sync from Google Calendar" to import events.</p>';
      } else {
        html += '<div class="timesheet-table"><table style="width: 100%; border-collapse: collapse; font-size: 12px;">';
        html += '<tr style="border-bottom: 1px solid var(--line);"><th style="text-align: left; padding: 8px; color: var(--muted); font-weight: 500;">Task</th><th style="text-align: right; padding: 8px; color: var(--muted); font-weight: 500;">Hours</th><th style="text-align: left; padding: 8px; color: var(--muted); font-weight: 500;">Dates</th></tr>';

        Object.keys(entriesByTask).sort().forEach(taskName => {
          const taskData = entriesByTask[taskName];
          const dates = taskData.entries.map(e => e.date).join(', ');
          html += '<tr style="border-bottom: 1px solid var(--line);"><td style="padding: 8px; color: var(--text);">' + taskName + '</td><td style="text-align: right; padding: 8px; color: var(--orange);">' + taskData.totalHours + 'h</td><td style="padding: 8px; color: var(--muted); font-size: 10px;">' + dates + '</td></tr>';
        });

        html += '<tr style="background: var(--panel-2); font-weight: 600;"><td style="padding: 8px; color: var(--text);">TOTAL (Last 30 Days)</td><td style="text-align: right; padding: 8px; color: var(--orange);">' + totalAllHours + 'h</td><td></td></tr>';
        html += '</table></div>';
      }
      html += '</div>';
      return html;
    }

    $("#search").oninput = (e) => {
      term = e.target.value;
      render();
    };

    // Auto-sync from Google Calendar if configured
    if (GOOGLE_CALENDAR_SYNC_URL && GOOGLE_CALENDAR_SYNC_URL.trim()) {
      fetch(GOOGLE_CALENDAR_SYNC_URL)
        .then(r => r.json())
        .then(data => {
          if (data.success && data.events) {
            timeEntries = data.events;
          }
        })
        .catch(e => console.log('Calendar sync skipped - URL not configured'));
    }

    render();
  </script>

  <style>
    .ai-badge {
      margin: 40px 0 8px auto;
      width: fit-content;
      background: #d4c4b0;
      color: #2a2420;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
    }

    .timesheet-section {
      margin-top: 40px;
      padding: 20px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .timesheet-section button {
      transition: all 0.2s ease;
    }

    .timesheet-section button:hover {
      background: var(--orange-soft) !important;
      transform: translateY(-1px);
    }

    .timesheet-table {
      overflow-x: auto;
    }

    .timesheet-table table tr:hover {
      background: var(--panel-2);
    }
  </style>
</body>
</html>
